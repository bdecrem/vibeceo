name: Rotate Supabase service key on Vercel

# Manual only. The Supabase service key was rotated; the web project's
# production env still had the old one, so every /api/synth-* route 500'd.
#   inspect: print project name + production env var NAMES (no values)
#   apply:   replace SUPABASE_SERVICE_KEY in production from the
#            SUPABASE_SERVICE_KEY_ROTATED repo secret, then redeploy production
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect | apply'
        required: true
        default: 'inspect'

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Inspect (names only)
        run: |
          echo "== project for VERCEL_PROJECT_ID =="
          vercel env ls production --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | sed -E 's/[[:space:]]+/ /g' | cut -c1-120 | head -60

      - name: Apply
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          set -e
          vercel env rm SUPABASE_SERVICE_KEY production --yes --token=${{ secrets.VERCEL_TOKEN }} || echo "(no existing production SUPABASE_SERVICE_KEY)"
          printf '%s' "${{ secrets.SUPABASE_SERVICE_KEY_ROTATED }}" | vercel env add SUPABASE_SERVICE_KEY production --token=${{ secrets.VERCEL_TOKEN }}
          echo "== production env now =="
          vercel env ls production --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -i supabase | sed -E 's/[[:space:]]+/ /g' | cut -c1-100

      - name: Redeploy production with the new env
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          set -e
          TEAM=""
          case "$VERCEL_ORG_ID" in team_*) TEAM="&teamId=$VERCEL_ORG_ID";; esac
          LATEST=$(curl -sf "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=1$TEAM" -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
          DEP_ID=$(echo "$LATEST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const d=j.deployments&&j.deployments[0];console.log(d?d.uid:"")})')
          NAME=$(echo "$LATEST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const d=j.deployments&&j.deployments[0];console.log(d?d.name:"")})')
          echo "latest production deployment: $DEP_ID ($NAME)"
          [ -n "$DEP_ID" ] || { echo "no production deployment found"; exit 1; }
          RESP=$(curl -s -w '\n%{http_code}' -X POST "https://api.vercel.com/v13/deployments?forceNew=1${TEAM}" -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" -H 'Content-Type: application/json' -d "{\"name\":\"$NAME\",\"deploymentId\":\"$DEP_ID\",\"target\":\"production\"}")
          echo "$RESP" | tail -1 | sed 's/^/redeploy HTTP /'
          echo "$RESP" | head -1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log("new deployment:",j.url||j.id||"", j.readyState||"", j.error?JSON.stringify(j.error):"")}catch(e){console.log(s.slice(0,300))}})'
