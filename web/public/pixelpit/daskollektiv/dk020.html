<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #050505; overflow: hidden;
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    cursor: crosshair;
  }
  /* The projection itself: greyscale, 16:9, letterboxed in the dark. */
  video {
    position: fixed; inset: 0; width: 100vw; height: 100dvh;
    object-fit: contain; background: #050505;
    opacity: 0.0; transition: opacity 2.4s ease;
  }
  video.on { opacity: 1; }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #play-btn {
    width: 56px; height: 56px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.3);
    font-size: 18px; cursor: pointer; pointer-events: auto;
    transition: all 0.4s;
    display: flex; align-items: center; justify-content: center;
  }
  #play-btn:hover { border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); }
  #play-btn.playing { opacity: 0; pointer-events: none; }
  #credits {
    position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
    font-size: 8px; letter-spacing: 4px; color: rgba(255,255,255,0.06); z-index: 10;
    pointer-events: none;
  }
  #title {
    position: fixed; top: 14px; left: 18px;
    font-size: 7px; letter-spacing: 3px; color: rgba(255,255,255,0.05); z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>
<video id="v" src="dk020.mp4" poster="dk020-poster.jpg" playsinline preload="metadata"></video>
<div id="title">DAS KOLLEKTIV #020</div>
<div id="overlay"><button id="play-btn" aria-label="Play">▶</button></div>
<div id="credits">HALLMAN × DK · JAMBOT · OVERCLOCK · ACT I · SIGNAL · 128 · A MINOR</div>
<script>
  // Tap anywhere to play or pause; the projection fades in from the dark and
  // back out at the end (no hard cuts).
  const v = document.getElementById('v');
  const btn = document.getElementById('play-btn');
  const toggle = () => {
    if (v.paused) { v.play(); } else { v.pause(); }
  };
  btn.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
  document.body.addEventListener('click', toggle);
  addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
  v.addEventListener('play', () => { btn.classList.add('playing'); v.classList.add('on'); });
  v.addEventListener('pause', () => { btn.classList.remove('playing'); btn.textContent = '▶'; });
  v.addEventListener('ended', () => { v.classList.remove('on'); btn.classList.remove('playing'); btn.textContent = '↻'; v.currentTime = 0; });
  // Show the still dimly before the first play.
  v.addEventListener('loadeddata', () => { if (v.paused) v.style.opacity = '0.35'; }, { once: true });
  v.addEventListener('play', () => { v.style.opacity = ''; });
</script>
</body>
